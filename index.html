<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBEMC.PL — Serwer Minecraft</title>
    <style>
        :root {
            --bg-dark: #07080d;
            --bg-card: #10121b;
            --bg-card-hover: #161926;
            --primary: #8b5cf6;       /* Neonowy fiolet */
            --primary-glow: rgba(139, 92, 246, 0.45);
            --secondary: #38bdf8;     /* Neonowy błękit */
            --online: #10b981;        /* Zielony status online */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.18), transparent 55%),
                radial-gradient(#1c2033 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* NAWIGACJA */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 8, 13, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-decoration: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.25s;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .nav-shop {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--primary);
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 8px;
        }

        .nav-shop:hover {
            background: var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        /* SEKCJA GŁÓWNA (HERO) */
        .hero {
            min-height: 82vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--online);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--online);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 16px;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
        }

        .hero h1 span {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            max-width: 580px;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 34px;
        }

        /* PASEK KOPIOWANIA IP */
        .ip-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 8px 8px 8px 22px;
            gap: 20px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: 0.25s;
        }

        .ip-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.45);
        }

        .ip-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            filter: brightness(1.15);
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-outline {
